name: Deploy EPM

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: epm-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy EPM
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::786584124104:role/EPM-GitHubActions-DeployRole
          aws-region: ap-northeast-2

      - name: Send deployment command
        id: deploy
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-01c1d9300d9e33ab1" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy nerhwida/epm from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/epm",
              "sudo -u ssm-user git fetch origin main",
              "sudo -u ssm-user git reset --hard origin/main",
              "docker compose build app",
              "docker compose up -d --no-deps --force-recreate app",
              "sleep 5",
              "curl --fail --silent --show-error http://127.0.0.1:4000/",
              "docker compose ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        shell: bash
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-01c1d9300d9e33ab1" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "EPM deployment successful."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-01c1d9300d9e33ab1" \
                  --query "{Output:StandardOutputContent,Error:StandardErrorContent}"

                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "EPM deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-01c1d9300d9e33ab1" \
                  --query "{Output:StandardOutputContent,Error:StandardErrorContent}"

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for EPM deployment."
          exit 1